# amber-ci jobs for shared-rust (spec: amber-ci docs/design.md §2; started
# from templates/rust-lib.toml).
#
# They match .github/workflows/self-test.yml one for one. self-test calls
# this repo's own rust-test.yml, whose two jobs become three here:
#   rust-test.yml `test`: test-cmd + extra-cmd  -> test
#                         clippy + rustfmt       -> lint  (continue-on-error there)
#   rust-test.yml `audit` (audit-blocking: true) -> audit (nightly here; see it)
# What does not carry over: self-test also dogfoods rust-test.yml itself (a
# change to the reusable workflow breaks here first). That is a property of
# GitHub Actions YAML, so it stays on GitHub.
#
# Private git deps: store-core is the only private one, and the planner grants
# every private dep Cargo.lock pins, so no job lists git_read.
#
# Hermetic reuse: every job runs `fetch` with the network, then `run` with
# none. No source file include_str!s anything, so markdown and the workflow
# YAML (read by no job here) are not inputs.

version = 1

[job.test]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
fetch = [
  # platform-secrets/tests/put_config_key.rs drives put-config-key.sh, which
  # needs jq; the image has none (GitHub's ubuntu runner does).
  "apt-get update -qq && apt-get install -y -qq --no-install-recommends jq",
  "cargo fetch --locked",
]
run = [
  # test-cmd. Doctests come along: platform-vault-dynamo's compile_fail
  # invariants live there.
  "cargo test --workspace --locked --offline --no-fail-fast",
  # extra-cmd: features break consumers as easily as code (platform-chirp-auth's
  # `testkit`). As on GitHub, it runs only once the tests pass.
  "cargo check --workspace --all-features --locked --offline",
]
required_for_main = true
reuse = true
timeout_minutes = 40   # rust-test.yml's bound: a cold full-workspace compile
cache = "rust-1.97.0"

[job.test.inputs]
exclude = ["**/*.md", ".github/**"]

[job.test.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"

[job.lint]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
fetch = ["rustup component add clippy rustfmt", "cargo fetch --locked"]
run = [
  # Both run, as in rust-test.yml (two continue-on-error steps): a fmt
  # failure must not hide clippy's findings. Fails if either fails.
  "rc=0; cargo fmt --all --check || rc=1; cargo clippy --workspace --all-targets --locked --offline -- -D warnings || rc=1; exit $rc",
]
required_for_main = false   # continue-on-error in rust-test.yml
reuse = true
timeout_minutes = 30
cache = "rust-1.97.0"

[job.lint.inputs]
exclude = ["**/*.md", ".github/**"]

[job.lint.env]
CARGO_HOME = "/cache/cargo"
CARGO_TARGET_DIR = "/cache/target"

[job.audit]
image = "docker.io/library/rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073"
# Nightly, not on every push (2026-11-05): an advisory published today must not
# fail PRs that leave the dependencies alone. amber-ci has no "only when these
# paths change" trigger, so the PR-time scan is rust-test.yml's (it runs on PRs
# that change a lockfile, manifest or .cargo/audit.toml), and the daily scan
# that pages is agent-platform--ops's dep-audit.yml. This one runs once a day on
# main's newest commit when main has moved, and a failure reports neutral.
# A nightly job cannot reuse, so it fetches the advisory database itself.
run = [
  # From `/`, so no repo cargo config applies to the install.
  "cd / && cargo install --locked cargo-audit --version 0.22.2",
  "cargo audit --file Cargo.lock",
]
required_for_main = false   # a nightly job never gates main
when = "nightly"
timeout_minutes = 20
cache = "audit"

[job.audit.env]
CARGO_HOME = "/cache/cargo"
