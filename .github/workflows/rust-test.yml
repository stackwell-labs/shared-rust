name: rust-test (private deps)

# Reusable workflow: clone private stackwell-labs cross-repo Cargo git deps (via a
# short-lived stackwell-labs-ci App install token) and run the workspace tests.
#
# Call it from a service's test.yml so the private-dep auth lives in ONE place
# instead of being hand-rolled (and drifting) per service. The caller MUST pass
# `secrets: inherit` — the App private key is an org secret and a called workflow
# only receives it when inherited.
#
#   jobs:
#     test:
#       uses: stackwell-labs/shared-rust/.github/workflows/rust-test.yml@main
#       with:
#         private-repos: store-core,vault
#         working-directory: backend
#       secrets: inherit

on:
  workflow_call:
    inputs:
      private-repos:
        description: 'Comma-separated stackwell-labs private repos to clone (e.g. "store-core,vault").'
        type: string
        required: true
      test-cmd:
        description: 'Test command to run in working-directory.'
        type: string
        default: 'cargo test --no-fail-fast'
      working-directory:
        type: string
        default: '.'
      cache-workspaces:
        description: >-
          Path passed to rust-cache `workspaces` (where the Cargo workspace +
          its target/ live). Defaults to working-directory. Set it when cargo is
          invoked from a member subdir but target/ is at the workspace ROOT — e.g.
          working-directory=backend with a repo-root [workspace]: pass "." so
          rust-cache caches ./target, not the empty backend/target.
        type: string
        default: ''
      extra-cmd:
        description: 'Optional second command (e.g. a feature-gated type-check). Skipped when empty.'
        type: string
        default: ''
      setup-cmd:
        description: >-
          Optional command run BEFORE test-cmd, in working-directory. Skipped
          when empty. Exists so a service whose tests need a live dependency can
          adopt this workflow instead of hand-rolling a whole copy of it:
          chirp-auth starts DynamoDB-Local and exports its endpoint via
          $GITHUB_ENV, which only works as a step in the SAME job as the tests.
          Writes to $GITHUB_ENV from here are visible to test-cmd, by design.
        type: string
        default: ''
      audit-blocking:
        description: >-
          Whether `cargo audit` FAILS the gate. Default false, matching the
          comment on the audit job: most services carry open advisories in shared
          transitive deps, and gating there would wedge four deploy pipelines on
          bumps unrelated to the change under test.
          .
          That comment offered two ways to gate a service that reaches zero --
          drop continue-on-error for EVERYONE, or fork the workflow. Both are
          bad: one wedges the others, the other is how chirp-auth ended up
          maintaining a private copy that re-accumulated every defect this
          workflow had already fixed. Per-caller is the third option.
        type: boolean
        default: false
      rust-toolchain:
        description: >-
          Pinned toolchain = the platform MSRV. Floating `stable` meant every
          service silently re-toolchained on Rust release day: a new rustc or a
          new clippy lint could turn a green gate red with zero repo changes,
          and "which Rust does this build with" had no answer. 1.97.0 is the
          version the whole platform was measured green on (2026-07-18) and is
          >= the 1.85 floor that the edition-2024 services (granite, drive,
          social-graph) require. Bump this deliberately, in one place.
        type: string
        default: '1.97.0'
    secrets:
      STACKWELL_CI_APP_PRIVATE_KEY:
        description: >-
          The stackwell-labs-ci App private key used to mint a read token for the
          private git deps.
          .
          DECLARED so a CROSS-ORG caller can pass it EXPLICITLY. `secrets: inherit`
          does not cross an organisation boundary: chirpauth/server-dev calling
          this workflow got `app-id: 3975703` (an org var, which does flow) and
          then `Error: Input required and not supplied: private-key`. Observed
          2026-06-10, re-confirmed 2026-08-25 on a branch before changing main --
          the note in chirp-auth's workflow was right and is still right.
          .
          required: false so the eight same-org callers using `secrets: inherit`
          are unaffected; inherit continues to populate it for them.
        required: false
    outputs:
      deps-changed:
        description: >-
          'true' when this run is a pull request that changes a lockfile, a
          manifest or an audit ignore list (the `audit` job ran); empty
          otherwise. For a caller with an audit of its own, such as
          chirp-auth's quickstart, so it runs on the same PRs as this one.
        value: ${{ jobs.deps-changed.outputs.changed }}

jobs:
  test:
    # Pinned, not ubuntu-latest: callers run Playwright here via extra-cmd
    # (chirpauth/server-dev's developer journey), and ubuntu-latest began moving
    # to 26.04 on 2026-10-19, where Playwright has no chromium build. 24.04 is
    # supported until 2029.
    runs-on: ubuntu-24.04
    # Measured over 607 runs (2026-07-15..08-25): median 4.2 min, p99 7.6, max 9.4
    # -- all with a WARM cache, which is what made 20 look like >2x headroom.
    #
    # It was not. On 2026-08-25 chirp-auth's first run on this workflow hit a cold
    # cache and `cargo test` alone took 966s, `extra check` another 206s. The job
    # was cancelled at the 20-minute bound and the IdP deploy was skipped with it.
    # The bound was measured against the happy path and then met the unhappy one.
    #
    # 40 keeps this a HANG bound (GitHub's default is 360) while surviving a cold
    # full-workspace compile of the largest caller. A cold run is not a hung run,
    # and a timeout that cannot tell them apart blocks deploys instead of saving
    # them. GitHub's default is 360, and on 2026-08-19
    # a stalled apt mirror rode that default to 361 minutes in this very job path
    # (drive `web (warden ceremony + parity)`). shared-terraform bounded its
    # build/deploy jobs the same day (c9b4f11); the test path was missed.
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
      # The runner's disk is the build's real ceiling. On 2026-11-07
      # compute-gateway#64 changed the lockfile enough to rebuild the aws-sdk
      # tree next to the stale copies a partial rust-cache hit had restored
      # (~817 MB compressed); GitHub warned "Free space left: 35 MB" and the
      # linker died with SIGBUS, twice, on a commit that passes locally
      # (shared-rust#14). The image ships toolchains no caller uses: .NET,
      # Android, GHC and CodeQL. Removing them, before the cache is unpacked,
      # gives every build that space back. Docker, Node and Java stay: callers
      # run DynamoDB-Local and S3 in docker and Playwright via extra-cmd.
      #
      # The delete frees ~22 GB but takes ~55 s (measured 2026-11-07), most of
      # a warm run's length, and private repos pay for every minute. So it runs
      # in the background, overlapping the toolchain install and the cache
      # restore, and `wait for disk space` below holds the build until it is
      # done. The runner keeps a step's background processes alive until the
      # job ends. The marker holds rm's exit status, so a failed or hung delete
      # fails that step instead of letting the build race a full disk.
      - name: free disk space (background)
        run: |
          df -h /
          sudo sh -c 'rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; echo $? > "$1"' sh "$RUNNER_TEMP/disk-freed" >/dev/null 2>&1 &
      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt
      - name: mint private-deps read token
        id: tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.STACKWELL_CI_APP_ID }}
          private-key: ${{ secrets.STACKWELL_CI_APP_PRIVATE_KEY }}
          owner: stackwell-labs
          repositories: ${{ inputs.private-repos }}
      - name: configure private git deps
        env:
          GIT_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/stackwell-labs/".insteadOf "https://github.com/stackwell-labs/"
      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Cache the dir that actually holds target/ — cache-workspaces when set
          # (repo-root workspace built from a member subdir), else working-directory.
          workspaces: ${{ inputs.cache-workspaces != '' && inputs.cache-workspaces || inputs.working-directory }}
          # SAVE only from the default branch; every ref still RESTORES from it.
          #
          # GitHub caps Actions cache at 10 GB per repo and evicts least-recently-
          # used above that. Measured 2026-08-25: drive 11.67 GB / 24 entries and
          # agent-platform--tests 10.03 GB / 18 were both over the cap, so those
          # repos were evicting their own caches and rebuilding cold. A large part
          # of the pressure was branch-scoped copies that nothing can ever read:
          # drive held 0.81 GB entries under refs/pull/5/merge and under a feature
          # branch, and GitHub's cache scoping means a PR's cache is visible only
          # to that PR. They cost the budget and evict main's entry, which every
          # branch DOES read.
          #
          # Tradeoff, stated: a PR touching Cargo.lock rebuilds the changed deps
          # each push instead of reusing its own previous save. That is strictly
          # better than the state above, where the entry it would have reused was
          # being evicted anyway.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: wait for disk space
        run: |
          marker="$RUNNER_TEMP/disk-freed"
          time timeout 300 sh -c 'until [ -s "$1" ]; do sleep 1; done' sh "$marker"
          status=$(cat "$marker")
          [ "$status" = 0 ] || { echo "::error::freeing disk space failed: rm exited $status"; exit 1; }
          df -h /
      - name: setup
        if: ${{ inputs.setup-cmd != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.setup-cmd }}
      - name: test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-cmd }}
      - name: extra check
        if: ${{ inputs.extra-cmd != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.extra-cmd }}
      # Runs even when the build failed, so a run that ran out of disk shows it
      # instead of a bare linker crash.
      - name: disk usage after build
        if: ${{ always() }}
        run: |
          df -h /
          du -sh "${{ inputs.cache-workspaces != '' && inputs.cache-workspaces || inputs.working-directory }}/target" || true

      # ---- quality floor: REPORTING ONLY -------------------------------------
      # No service on the platform is currently clippy- or rustfmt-clean (measured
      # 2026-07-18: clippy 139/38/50/22/1 unique warnings and rustfmt 1210/97/267/
      # 307/88 diff hunks for chirp-auth/granite/drive/social-graph/shriek). Gating
      # these today would turn every repo's gate red at once for pre-existing debt
      # that has nothing to do with the change under test — so they run
      # `continue-on-error` and only annotate. That makes the debt VISIBLE and stops
      # it growing unnoticed, which is the whole point of a floor.
      #
      # These run AFTER the tests deliberately: the real signal is never delayed by
      # a lint pass, and clippy reuses the already-warm target dir.
      #
      # To GATE a service once it reaches zero: drop `continue-on-error` here only
      # when EVERY caller is clean (this workflow is shared by four services), or
      # move that service's lint step into its own test.yml as a blocking step.
      - name: clippy (non-blocking)
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt (non-blocking)
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all --check

  # WHEN THE ADVISORY SCAN RUNS (2026-11-05): only on a pull request that changes
  # a lockfile, a manifest or an audit ignore list. Never on a deploy (callers'
  # deploy.yml reach this workflow through workflow_call on push, schedule or
  # dispatch, where this job is skipped), never on a PR that leaves the
  # dependencies alone.
  #
  # The scan's verdict depends on the date as well as on the tree. Run on every
  # PR and deploy, one newly published advisory turned unrelated work red in
  # every repo at once: 7 repos on 2026-10-24, and drive's test-plane deploy red
  # every day from 2026-11-02 on pulldown-cmark RUSTSEC-2026-0433 (drive#1).
  # A PR that does not touch dependencies cannot add an advisory, so scanning it
  # tells that PR nothing it can act on.
  #
  # main is still scanned every day: agent-platform--ops's dep-audit.yml audits
  # each caller's main and reports each one to Shriek as a dead-man's switch, so
  # an advisory that stays open pages instead of waiting for the next lockfile
  # PR. A caller added here belongs in that workflow's repo list too.
  #
  # A skipped job reports `skipped`, which land_amber.py, land_pr.py and GitHub
  # required checks all accept, so a required `test / audit` still passes.
  deps-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # A PR's checkout is its merge commit, whose first parent is the base
      # branch's tip: HEAD^1..HEAD is exactly what the PR changes.
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: did the PR change a lockfile, manifest or audit ignore list?
        id: diff
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 HEAD)
          deps=$(printf '%s\n' "$files" | grep -E '(^|/)(Cargo\.lock|Cargo\.toml|package-lock\.json|package\.json|\.cargo/audit\.toml)$' || true)
          if [ -n "$deps" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'dependency files changed, auditing:\n%s\n' "$deps"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no lockfile, manifest or audit ignore list changed: audit skipped (main is audited daily)"
          fi

  # Advisory scan runs as its OWN job, in parallel with `test`, so that installing
  # cargo-audit does not sit on the gate's critical path.
  #
  # Two claims that used to live in this comment were both FALSE, and each one on
  # its own reduced the scan to nothing while reporting green.
  #
  # FALSEHOOD 1: "cargo audit only needs the committed Cargo.lock — no private-dep
  # token, no compile". It resolves the manifest first, so a private git dep must
  # be fetchable. Without the token the scan died before scanning anything and
  # `continue-on-error` reported the job green — verified in drive's own run
  # 32813036899 (2026-08-25):
  #
  #   error: failed to get `store-core` as a dependency of package `drive-service`
  #     failed to authenticate when downloading repository
  #
  # Three services (drive, granite, pigeon) therefore had an advisory scan that had
  # never scanned a single advisory, reported as passing. The false comment was
  # load-bearing: a 2026-08-28 audit of this gate read it and certified the dead
  # scan as live. The mint + insteadOf steps below are the same two the `test` job
  # runs; keep them in step.
  #
  # FALSEHOOD 2, found only once fixing the first one let the scan get further:
  # "cargo-audit resolves the lock through the workspace root, so running from
  # working-directory is correct even when the lock lives in a parent dir". It does
  # not. It reads ./Cargo.lock relative to cwd, and drive's next run said so —
  # `error: not found: Couldn't load Cargo.lock`. Three callers build from a member
  # subdir whose lock lives above it (drive, granite, pigeon), so the scan step now
  # walks UP for the nearest lock and fails loudly if there is none. Note that
  # `cache-workspaces` is not a usable substitute: granite and pigeon do not set it
  # and still keep their lock at the repo root.
  #
  # NON-BLOCKING for the same reason as clippy: measured 2026-07-18, granite has 4
  # open advisories, drive 4, social-graph 8, shriek 3 — mostly a shared
  # rustls-webpki set plus quinn-proto RUSTSEC-2026-0185 (7.5 high) in drive and
  # social-graph. Gating would wedge four deploy pipelines on dep bumps that are
  # not this change. chirp-auth is the exception: it is already advisory-clean and
  # already gates on audit in its own hand-rolled workflow — that stays BLOCKING.
  audit:
    needs: deps-changed
    if: needs.deps-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # After the prebuilt install below this job is seconds, not minutes; 10 is a
    # hang bound, not a budget. Same reasoning as `test` above.
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      # Same private-dep auth the `test` job does. Without these two steps
      # `cargo audit` cannot resolve a private git dependency and exits before
      # scanning — silently, because the scan step is continue-on-error.
      - name: mint private-deps read token
        id: tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.STACKWELL_CI_APP_ID }}
          private-key: ${{ secrets.STACKWELL_CI_APP_PRIVATE_KEY }}
          owner: stackwell-labs
          repositories: ${{ inputs.private-repos }}
      - name: configure private git deps
        env:
          GIT_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/stackwell-labs/".insteadOf "https://github.com/stackwell-labs/"
      # A PREBUILT binary, not a source build. `cargo install --locked
      # cargo-audit` compiled the tool from scratch on every run of every service:
      # measured across 327 runs (2026-08-01..25) it was 1,653 minutes -- 18% of
      # the entire org's Actions spend, and 24% of the recurring load once one-off
      # hangs are excluded. It was uniform, not occasional (median 320s, p90 333s,
      # max 362s), and it produced nothing but a binary whose actual `cargo audit`
      # then takes 0.02 min. The audit job's median (5.7 min) was LARGER than the
      # test job's (4.2 min): the advisory scan cost more than the tests.
      #
      # An earlier pass moved this into its own parallel job so it would not sit on
      # the gate's critical path (see the comment above). That fixed WALL-CLOCK.
      # Billing is per job-minute, so it changed the cost by exactly zero -- a
      # latency fix asked to do a cost job.
      #
      # Same tool, same version resolution, same advisories: nothing is traded
      # away. drive's mutants.yml already installs cargo-mutants exactly this way.
      #
      # continue-on-error is LOAD-BEARING, not decoration. Callers wire this
      # workflow in as `needs: [test, ...]`, and a reusable workflow's result is
      # the aggregate of its jobs -- so an install failure here would fail the
      # `audit` job, fail the called workflow, and wedge every deploy on a
      # NON-BLOCKING advisory scan. The `cargo install` line this replaces carried
      # the same flag for the same reason.
      - name: install cargo-audit
        continue-on-error: ${{ !inputs.audit-blocking }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        continue-on-error: ${{ !inputs.audit-blocking }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          # cargo-audit reads ./Cargo.lock; it does NOT walk up to the workspace
          # root the way cargo does. Find the nearest lock at or above cwd.
          dir="$PWD"
          while [ "$dir" != "/" ] && [ ! -f "$dir/Cargo.lock" ]; do dir="$(dirname "$dir")"; done
          if [ ! -f "$dir/Cargo.lock" ]; then
            echo "::error::no Cargo.lock at or above $PWD — the advisory scan has nothing to scan"
            exit 1
          fi
          echo "scanning $dir/Cargo.lock"
          cargo audit --file "$dir/Cargo.lock"
