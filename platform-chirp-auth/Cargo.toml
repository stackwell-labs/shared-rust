[package]
name = "platform-chirp-auth"
# Explicit version (not inherited) so this crate can advance independently of
# platform-lambda / platform-http-error (which stay at the workspace's 0.1.0).
# 0.2.1 reverts the 0.2.0 compile-gating of decode_trusted_headers: that gate
# was a mis-design — the function is a neutral header-PARSING primitive used by
# authenticated impersonation in production (e.g. drive's internal-service
# token path), not a pure dev bypass. The unauthenticated-trust decision is
# gated at each backend instead.
# 0.2.3 bumps the workspace chirp-auth-client dep v0.7.0 -> v0.9.0 (pairwise
# subjects, no email in the verified identity). API-compatible here: this crate
# only re-exports `bearer_token`, which is unchanged.
# 0.2.4 bumps the workspace chirp-auth-client dep v0.9.0 -> v0.10.0 to collapse
# the version skew with the services (Drive/Granite) which already pin v0.10.0,
# so they no longer compile two copies of the token verifier. `bearer_token` is
# unchanged, so this crate is API-compatible.
# 0.3.0 bumps the workspace chirp-auth-client dep v0.10.0 -> v0.12.0 and adds the
# shared `MachineAuth` (machine-token verify + the lib-native client_id allowlist
# gate, an optional issuer-fallback list, and a return shape carrying machine_sub
# / owner_sub / client_id / chirp Environment / issuer) so Drive/Granite/Spend-Core
# can drop their hand-rolled copies. New `reqwest` dep (the JWKS fetch the verify
# call needs); v0.12 types appear in the public API, so this is a minor bump.
# 0.3.3 bumps the workspace chirp-auth-client dep v0.12.1 -> v0.14.0 (the canonical
# client). Two migrations were needed, and every service adopting v0.14 will hit the
# same two: (1) client v0.13 added `ChirpVerifiedIdentity::Test`, so the machine-path
# match gained a `Test` arm (a test principal is NotMachine, like Human); (2) client
# v0.13 made the `typ` header REQUIRED on ID-token verify, so the test fixture mints
# the real `chirp-id+jwt` typ instead of the generic `JWT`. `bearer_token` +
# `MachineAuth` public shapes are unchanged.
# 0.4.0 adds the `testkit` module (opt-in `testkit` feature): a local mock
# JWKS server + real RS256 signing, extracted from chirp-auth-client's own
# private verify-path test harness into a public, reusable primitive. Exists
# to replace `decode_trusted_headers`' unauthenticated dev-bypass path in
# every service's test suite with tokens that exercise the REAL verification
# code. Additive; nothing existing changes shape.
# 0.5.0 adds `MachineAuthError::Unavailable` (client v0.17's `JwksFetch`: the
# JWKS could not be fetched) mapped to a 503, instead of folding it into
# `NotMachine` (a 401). BREAKING for an exhaustive match on the enum (Granite):
# add an `Unavailable` arm that answers 503 and does not fall through.
# Repo tag v0.5.3 bumps the workspace chirp-auth-client dep v0.17.0 -> v0.18.0
# (adds `verify_chirp_event`, chirp-auth#87), so a service that calls it builds
# one copy of the client, not two. Nothing here changes shape.
# 0.6.0 (shared-rust#3) adds `VerifyFailure` (the one classification of
# `ChirpAuthError`: a JWKS outage is a 503, everything else a 401), and
# `Authenticator`: a typed `Policy` fixed at construction, `Caller`,
# `AuthFailure`, an axum extractor and the `env` readers
# (`{PREFIX}_CHIRP_ISSUER` / `_HUMAN_AUDIENCES` / `_MACHINE_CLIENTS`). The
# testkit gains `Fixture::global()` (a JWKS issuer and a throttled one on a
# long-lived thread) and `mint_test_id_token`. Additive; `MachineAuth` stays.
# 0.6.1 (shared-rust#5, repo tag v0.6.1) adds the `PairwiseSub`/`RootId` id
# types and the machine-token `RootResolver`/`OperatorIntrospector` clients,
# which return the authenticator's `ConfigError`. Additive. Repo tag v0.5.10
# published 0.6.0 without them, and repo tag v0.6.0 carries them still numbered
# 0.6.0; pin v0.6.1 or later for them.
# 0.6.2 (shared-rust#17, repo tag v0.6.2) re-exports `verify_chirp_event`,
# `ChirpEvent` and `EventRejection`, and the `testkit` feature re-exports
# chirp-auth-client's event-signing kit (`JwksServer`, `TestSigningKey`,
# `user_deleted_claims`), so a deletion-webhook receiver drops its direct
# chirp-auth-client dependency. Additive.
# 0.7.0 (shared-rust#18, repo tag v0.7.0) decides test-ness by the verifying
# keyset, so `TestIdentities::Reject` refuses a test-keyset machine token too
# (0.6 returned it as `Caller::Machine { environment: Test }`). BREAKING:
# `Caller::Human`/`Machine` lose `environment` (they are production by
# construction); `Caller::Test` is `{ tenant, principal: TestPrincipal }`, where
# `TestPrincipal` is `Human { sub }` or `Machine { sub, owner_sub, client_id }`;
# `Caller::environment()` returns an owned `Environment`. A service that took
# test machines under `Reject` (model-gateway) switches to `Accept` and matches
# `Caller::Test { principal: TestPrincipal::Machine { .. }, .. }`.
# 0.8.0 (shared-rust#19, repo tag v0.8.0) serves production and declared test
# tenants from one deployment: `Policy::test_tenants` (`Option<BTreeSet>`)
# replaces `test_identities`, each tenant verified at `{issuer}/test/{tenant}`.
# `authenticate`/`verify` return `Authenticated { caller, plane }`, where `Plane`
# (`Environment`, `Prod | Test { tenant }`) picks the service's store handle;
# `Authenticator::planes()` lists them for boot. BREAKING: `TestIdentities`,
# `TestPrincipal`, `Caller::Test` and `Caller::environment()` are gone (a test
# caller is a `Caller::Human`/`Machine` on a test plane), and the axum
# extractor is `Authenticated`, not `Caller`. A prod-only service (was
# `Reject`) sets `test_tenants: None` and takes `Authenticated { caller, .. }`;
# a test-issuer deployment (was `Accept`) sets `None` too, and its one plane is
# `Test { tenant }` from the issuer.
# 0.8.1 (shared-rust#10, repo tag v0.10.1) rebuilds `testkit` on
# chirp-auth-client's: tokens are signed with its fixed `TestSigningKey` and
# keys served by its `JwksServer`, so the `rsa`/`sha2`/`rand` deps and the
# per-process RSA keygen are gone. Same public API; the key is now a fixed
# public test key rather than one generated per test binary.
version = "0.8.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared chirp-auth glue: the bearer Authenticator, error classification, header constants, generic on-behalf-of grant resolution, pairwise/root id types, root-resolve and operator-introspect clients."

[features]
# Marker feature each backend forwards to gate ITS unauthenticated trusted-header
# bypass path (the `*_TRUSTED_HEADER_AUTH=true` dev/integration affordance).
# `decode_trusted_headers` itself is unconditional — it only parses headers and
# is also used by authenticated impersonation in production.
dev-trusted-headers = []
# The hermetic-test-token module (`testkit`). Optional so a production
# dependent never pulls in test signing keys or a JWKS server; every service's
# `[dev-dependencies]` entry for this crate should enable it.
# It is built on chirp-auth-client's own `testkit` (its fixed signing keys and
# JWKS server, shared-rust#10), which it also re-exports (shared-rust#17).
testkit = ["dep:tokio", "chirp-auth-client/testkit"]

[dependencies]
http = { workspace = true }
axum = { workspace = true }
chirp-auth-client = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Reads a token's unverified `iss` to pick which plane's keyset verifies it.
base64 = "0.22"
platform-http-error = { path = "../platform-http-error" }
# ── testkit's deps (optional; see the `testkit` feature) ────────────────────
# The fixture's own runtime thread and its 429 issuer.
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
# This crate with `testkit` on, so a plain `cargo test --workspace` (CI's
# command) builds and runs the testkit and the Authenticator tests that use it.
platform-chirp-auth = { path = ".", features = ["testkit"] }
wiremock = "0.6"
